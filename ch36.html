<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Events</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <style>
        table {
            width: 70%;
            border-collapse: collapse;
            background-color: lightyellow;
        }

        th {
            background-color: lightblue;
            color: black;
            padding: 10px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        col.time {
            background-color: lightgray;
        }

        tr:nth-child(even) {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>My Daily Schedule</h1>

    <table>
        <colgroup>
            <col class="time">
            <col>
        </colgroup>

        <tr>
            <th>Time</th>
            <th>Event</th>
        </tr>

        <tr>
            <td>7:00 AM</td>
            <td>Wake up and get ready</td>
        </tr>

        <tr>
            <td>7:30 AM</td>
            <td>Eat breakfast</td>
        </tr>

        <tr>
            <td>8:00 AM</td>
            <td>Go to school</td>
        </tr>

        <tr>
            <td>12:00 PM</td>
            <td>Eat lunch</td>
        </tr>

        <tr>
            <td>3:00 PM</td>
            <td>Go home</td>
        </tr>

        <tr>
            <td>3:30 PM</td>
            <td>Do homework</td>
        </tr>

        <tr>
            <td>5:00 PM</td>
            <td>Play basketball</td>
        </tr>

        <tr>
            <td>6:30 PM</td>
            <td>Eat dinner</td>
        </tr>

    </table>

</body>
</html>
